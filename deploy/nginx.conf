# Nginx site config for SocialMind.
# Copy this to /etc/nginx/sites-available/socialmind on the server, then:
#   ln -sf /etc/nginx/sites-available/socialmind /etc/nginx/sites-enabled/socialmind
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below before copying.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 25M;

    # Dashboard (psychologist) at root: /
    root /home/socialmind/app/frontend/dist;
    index index.html;

    # Child web app at /child
    location /child/ {
        alias /home/socialmind/app/SOCIALMIND-CHILD_APP/dist/;
        try_files $uri $uri/ /child/index.html;
    }

    # API proxy to Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Dashboard SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
